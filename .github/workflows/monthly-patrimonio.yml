name: Resumen de patrimonio por WhatsApp (semanal)

# Cada domingo envía por WhatsApp el mensaje semanal completo: patrimonio total,
# su variación, los movimientos de precio ≥5% de cada carta/skin (con el precio
# anterior y el actual) y un aviso por cada fuente que no esté conectada o haya
# fallado. Antes de componerlo, el servidor revaloriza EN VIVO skins, cartas,
# imagin (PSD2) y Trade Republic. Aquí solo disparamos el endpoint.
# (También se puede ejecutar a mano con "Run workflow".)
on:
  schedule:
    - cron: "20 17 * * 0"    # domingo 17:20 UTC ≈ 19:20 Europe/Madrid
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar resumen de patrimonio
        env:
          APP_URL: ${{ vars.APP_URL || 'https://mi-patrimonio.onrender.com' }}
          TOKEN: ${{ secrets.SUMMARY_TOKEN }}
        run: |
          curl -fsS -X POST "$APP_URL/api/monthly-summary?token=$TOKEN" \
            && echo "Resumen de patrimonio solicitado."
