name: WhatsApp precios de la semana (±5%, manual)

# Los movimientos de precio ya viajan DENTRO del resumen semanal de patrimonio
# (monthly-patrimonio.yml), así que este workflow ya no tiene cron: enviaba un
# segundo mensaje con la misma información. Se queda como disparo MANUAL para
# probar la alerta de precios por separado.
on:
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    env:
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE || '34640253466' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}   # histórico de precios compartido con la web
      ALERT_THRESHOLD: "5"
      # Disparo manual = prueba: envía siempre, aunque no haya movimientos.
      ALERT_SEND_EMPTY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt
      - name: Calcular movimientos ±5% y enviar WhatsApp
        working-directory: app
        run: python -m jobs.weekly_whatsapp
