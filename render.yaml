# Blueprint de Render: panel web (plan gratuito).
#
# ⚠️ NO uses la Postgres gratuita de Render: CADUCA A LOS 30 DÍAS, deja de
# aceptar conexiones y a los 14 días más se borra con todos los datos dentro.
# https://render.com/docs/free
#
# La base de datos va FUERA, en Neon (https://neon.com): plan gratuito
# permanente, sin tarjeta y sin caducidad. Su compute se duerme a los 5 min de
# inactividad y despierta solo al conectarse, así que no hay nada que mantener.
# Pega su cadena de conexión (la del POOLER) en DATABASE_URL desde el panel de
# Render. Los mensajes programados (precios, WhatsApp) corren en GitHub Actions.
#
# Supabase también es gratis para siempre, pero PAUSA el proyecto tras 1 semana
# de inactividad y hay que despausarlo a mano: para un panel que abres de vez en
# cuando es volver al mismo problema.
services:
  - type: web
    name: mi-patrimonio
    runtime: docker
    plan: free                # gratis; se duerme al estar inactiva y despierta al abrirla
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Pega aquí (en Render → Environment) la cadena de conexión de Neon; usa
      # la del POOLER (el host que lleva `-pooler`, IPv4). Si no la defines, la
      # app usa SQLite efímero y pierdes el histórico en cada reinicio.
      # Formato: postgresql://usuario:clave@ep-xxx-pooler.<region>.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: ENABLE_SCHEDULER
        value: "0"            # los jobs van por GitHub Actions, no en la web

      # --- Banco por PSD2 (Enable Banking) ---------------------------------
      # Se declaran aquí para que Render cree el hueco y solo haya que pegar el
      # valor: sin esto había que acordarse del nombre exacto de cada variable.
      # La URL de retorno que hay que registrar en Enable Banking la muestra la
      # propia web en ⚙️ Configuración (es https://<tu-app>/imagin/callback).
      - key: ENABLE_BANKING_APP_ID
        sync: false
      - key: ENABLE_BANKING_PRIVATE_KEY    # PEM completo o su base64
        sync: false
      - key: ENABLE_BANKING_COUNTRY
        value: ES
      # Opcional: fija el banco y desactiva el selector de la web. Si se deja
      # vacío, el banco se elige desde ⚙️ Configuración.
      - key: ENABLE_BANKING_ASPSP
        sync: false
      # Opcional: solo si registraste en Enable Banking una URL de retorno
      # distinta de /imagin/callback.
      - key: ENABLE_BANKING_REDIRECT_URL
        sync: false

      # --- Trade Republic (para que el resumen semanal entre solo) ----------
      - key: TR_PHONE
        sync: false
      - key: TR_PIN
        sync: false

      # --- Resumen semanal por WhatsApp (gratis, CallMeBot) ----------------
      - key: CALLMEBOT_APIKEY
        sync: false
      - key: CALLMEBOT_PHONE
        sync: false
      - key: SUMMARY_TOKEN
        sync: false

      # Opcionales: solo si además quieres RECIBIR PDFs por WhatsApp (vía Twilio).
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
